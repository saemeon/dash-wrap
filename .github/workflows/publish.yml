name: Publish Package

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # trusted publishing
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/dash-wrap
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
